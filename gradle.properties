# Build JVM. The default heap is small enough that the Kotlin compiler daemon spills, and
# metaspace exhaustion is the usual cause of slow rebuilds in multi-module Kotlin projects.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Build the modules concurrently. The graph is shallow and wide enough to exploit:
# engine and report both depend only on core, so they compile in parallel.
org.gradle.parallel=true

# Reuse task outputs across builds, branches, and CI runs.
org.gradle.caching=true

# Skip configuration entirely when nothing in the build logic changed. The largest win
# for the edit-test loop, and far cheaper to maintain from the start than to retrofit:
# every task added from here on is checked for compatibility as it lands.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# Kotlin incremental compilation across module boundaries.
kotlin.incremental=true

# Deliberately not set:
#
#   org.gradle.configureondemand   Superseded by the configuration cache, and the two
#                                  interact badly. Leaving it off is the supported path.
#   org.gradle.daemon              Already the default locally, and CI runs are
#                                  single-use, so pinning it adds nothing.

# Project version, surfaced in run.json as toolVersion.
version=0.1.0
