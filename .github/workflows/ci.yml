name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Run formatting first so a style failure is obvious rather than buried in a
      # longer build. It is also part of `build`, where it will be up to date.
      - name: Check formatting
        run: ./gradlew ktlintCheck

      # Compilation and unit tests. Compiler warnings are errors via the convention plugin.
      - name: Build and unit test
        run: ./gradlew build

      # Integration tests exercise a real gradle-profiler process. Without it installed
      # they would skip, and CI would go green having tested nothing.
      - name: Install Gradle Profiler
        run: |
          set -euo pipefail
          VERSION=0.25.2
          curl -sSfL -o /tmp/gradle-profiler.zip \
            "https://github.com/gradle/gradle-profiler/releases/download/v${VERSION}/gradle-profiler-${VERSION}.zip"
          unzip -q /tmp/gradle-profiler.zip -d "$HOME/tools"
          echo "$HOME/tools/gradle-profiler-${VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle Profiler is available
        run: gradle-profiler --version

      - name: Integration test
        run: ./gradlew integrationTest

      - name: Package
        run: ./gradlew installDist

      # Packaging verification: a distribution that builds but cannot start is not packaged.
      - name: Verify packaged CLI starts
        run: ./cli/build/install/gradle-benchmark/bin/gradle-benchmark --help

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
